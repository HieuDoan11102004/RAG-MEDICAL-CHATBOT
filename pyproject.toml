[project]
name = "rag-medical-chatbot-vercel"
version = "0.1.0"
description = "Vercel deployment configuration for the medical RAG chatbot API"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.13.2",
    "flask>=3.1.3",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-openai>=0.3.35",
    "langchain-text-splitters>=1.1.1",
    "pypdf>=6.9.2",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
]

[tool.vercel]
entrypoint = "backend.app.application:app"
