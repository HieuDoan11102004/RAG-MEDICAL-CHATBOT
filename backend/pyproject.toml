[project]
name = "rag-medical-chatbot"
version = "0.1.0"
description = "Backend JSON API for the medical RAG chatbot"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.13.2",
    "flask>=3.1.3",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-openai>=0.3.35",
    "langchain-text-splitters>=1.1.1",
    "langfuse>=4.14.3",
    "pdfplumber>=0.11.9",
    "pypdf>=6.9.2",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "langgraph>=1.0.10",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
evaluation = [
    "ragas>=0.4.3,<1.0",
]

[tool.vercel]
entrypoint = "app.application:app"
